# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: gameplay_network_transport
    status: active
    pattern: rpc
    producer: unity-client
    consumers:
      - network-session-transport
      - match-lifecycle-room-state
    adr: docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    signal_signature: "length-prefixed TCP messages carrying connect/join/ready/input/snapshot/event DTOs"
    referenced_by:
      - docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    added: 2026-04-16
    revised: ""
  - contract: match_state_transition_contract
    status: active
    pattern: direct_call
    producer: match-lifecycle-room-state
    consumers:
      - results-persistence-leaderboard
      - hud-results-and-ranking-ui
    adr: docs/architecture/adr-0002-match-state-machine-and-event-ordering.md
    signal_signature: "server-owned MatchState and MatchEndReason transitions"
    referenced_by:
      - docs/architecture/adr-0002-match-state-machine-and-event-ordering.md
      - docs/architecture/adr-0004-runtime-ui-stack-and-screen-flow.md
    added: 2026-04-16
    revised: ""

  - contract: leaderboard_query_response
    status: active
    pattern: direct_call
    producer: results-persistence-leaderboard
    consumers:
      - hud-results-and-ranking-ui
    adr: docs/architecture/adr-0003-persistence-boundary-and-leaderboard-formula.md
    signal_signature: "QueryTopAsync(limit) -> IReadOnlyList<LeaderboardRow>"
    referenced_by:
      - docs/architecture/adr-0003-persistence-boundary-and-leaderboard-formula.md
      - docs/architecture/adr-0004-runtime-ui-stack-and-screen-flow.md
    added: 2026-04-16
    revised: ""


