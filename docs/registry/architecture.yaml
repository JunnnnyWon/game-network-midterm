# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_client_database_access
    status: active
    description: "Unity clients must never connect to MySQL directly. All persistence and leaderboard access goes through the authoritative server gateway."
    why: "Direct client DB access exposes credentials, bypasses authority checks, and breaks idempotent match-result handling."
    adr: docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    added: 2026-04-16

  - pattern: client_authoritative_competitive_state
    status: active
    description: "Clients must never authoritatively decide score, battery pickup success, trap resolution, slow-hit outcomes, or match victory."
    why: "Client-owned competitive outcomes create cheating and desync risk in a multiplayer assignment project."
    adr: docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    added: 2026-04-16
  - pattern: blocking_match_end_on_db_write
    status: active
    description: "The game must never wait on a MySQL write before showing match results or returning room state to the client."
    why: "Infrastructure latency must not stall gameplay conclusion or presentation flow."
    adr: docs/architecture/adr-0003-persistence-boundary-and-leaderboard-formula.md
    added: 2026-04-16

  - pattern: ui_derived_match_outcome
    status: active
    description: "Runtime UI must never infer winner, timeout reason, or persistence success from local assumptions; it renders only server-provided state."
    why: "Derived UI outcomes create mismatch between what players see and what the authoritative server decided."
    adr: docs/architecture/adr-0004-runtime-ui-stack-and-screen-flow.md
    added: 2026-04-16

  - pattern: battery_spawn_same_point_loop
    status: active
    description: "Battery respawns must not repeatedly reuse the same spawn point when valid alternatives exist."
    why: "Repeated identical spawns encourage camping and undermine route-based competition."
    adr: docs/architecture/adr-0005-battery-spawn-and-score-pacing-model.md
    added: 2026-04-16

  - pattern: unbounded_crowd_control_stacking
    status: active
    description: "Slow shot and trap effects must not stack multiplicatively or refresh indefinitely to keep a player permanently slowed."
    why: "Unbounded crowd control destroys fairness and violates the intended short, readable competitive loop."
    adr: docs/architecture/adr-0006-slow-shot-and-trap-fairness-rules.md
    added: 2026-04-16


