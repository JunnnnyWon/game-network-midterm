# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: multiplayer_transport
    status: active
    api: custom_length_prefixed_tcp_protocol
    not: Unity Netcode for GameObjects
    adr: docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    reason: "The assignment requires a distinct C# server and MySQL boundary, so a custom external protocol keeps authority and persistence outside Unity."
    referenced_by:
      - docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    added: 2026-04-16
    revised: ""
  - purpose: client_input_api
    status: active
    api: Unity Input System package
    not: legacy Input Manager
    adr: docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    reason: "Unity 6.3 deprecates legacy input APIs and the client transport depends on callback/action-map based input capture."
    referenced_by:
      - docs/architecture/adr-0001-network-authority-and-transport-strategy.md
    added: 2026-04-16
    revised: ""
  - purpose: runtime_ui_stack
    status: active
    api: Unity UI Toolkit runtime UI
    not: UGUI (Canvas)
    adr: docs/architecture/adr-0004-runtime-ui-stack-and-screen-flow.md
    reason: "Unity 6.3 recommends UI Toolkit for new runtime UI and the project needs a simple single-document screen flow."
    referenced_by:
      - docs/architecture/adr-0004-runtime-ui-stack-and-screen-flow.md
    added: 2026-04-16
    revised: ""


